<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel - Nível de Serviço</title>
<meta name="theme-color" content="#642A90">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  /* paleta da empresa */
  --roxo:#642A90; --verdeB:#99CC33; --laranja:#FF9901; --rosa:#EC357D; --azulB:#0164C9;
  /* tons do roxo (cor principal) */
  --p50:#f6f1fa; --p100:#ebe0f4; --p200:#d5bfe7; --p300:#b48fd3; --p500:#8549b5; --p700:#642A90; --p800:#52227a; --p900:#3a1658;
  --brand:var(--p700); --brand-ink:#fff; --accent:var(--p700);
  --bg:#f5f3f8; --card:#fff; --ink:#1f1530; --ink2:#5b5068; --ink3:#9a90a8; --line:#e6e0ee;
  /* status: verde / laranja / rosa da paleta */
  --verde:var(--verdeB); --amarelo:var(--laranja); --vermelho:var(--rosa); --azul:var(--azulB);
  --ok:#5f8a12; --okbg:#eef7dc; --warn:#b36800; --warnbg:#fff1dc; --bad:#c41a60; --badbg:#fde6ef;
  --calc:var(--azulB); --calcbg:#e2eefb; --user:var(--p700); --userbg:var(--p100);
  --bar1:var(--p100); --bar2:var(--p300); --bar3:var(--p700);
  --r:14px; --sh:0 1px 2px rgba(58,22,88,.06),0 6px 18px rgba(58,22,88,.06);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#140c1d; --card:#1f1530; --ink:#efe9f6; --ink2:#bdb1cc; --ink3:#7d7190; --line:#352849;
    --brand:var(--p800); --accent:var(--p500);
    --ok:#b6e05a; --okbg:#253312; --warn:#ffb347; --warnbg:#3a2608; --bad:#ff6fa5; --badbg:#3f1226;
    --calc:#5fa8ff; --calcbg:#0d2747; --user:#d3b5f0; --userbg:#3a2356;
    --bar1:#3a2356; --bar2:#8549b5; --bar3:#d5bfe7; --sh:none; --azul:#3d8fe6; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--p800),var(--p700) 60%,var(--p500));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
header .ver{font-size:11px;opacity:.6}
main{padding:12px 12px calc(84px + var(--safe-b));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav button{flex:1;border:0;background:none;color:var(--ink3);padding:10px 4px 12px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--ink2);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font:650 15px system-ui;background:var(--accent);color:#fff;width:100%;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.muted{color:var(--ink2)} .small{font-size:12.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--ink2)} .kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:650}
.pill.VERDE{background:var(--okbg);color:var(--ok)} .pill.AMARELO{background:var(--warnbg);color:var(--warn)} .pill.VERMELHO{background:var(--badbg);color:var(--bad)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart .cap{font-size:12.5px;color:var(--ink2);min-height:18px;margin-top:6px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* conferência */
table.conf{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;letter-spacing:-.2px}
table.conf th{font:600 10.5px system-ui;color:var(--ink2);text-align:right;padding:0 4px;letter-spacing:0}
table.conf th:first-child{text-align:left}
table.conf td{padding:8px 4px;text-align:right;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.conf td:first-child{padding-left:7px;text-align:left;border-left:1px solid var(--line);border-radius:9px 0 0 9px;font-weight:650}
table.conf td:last-child{padding-right:7px;border-right:1px solid var(--line);border-radius:0 9px 9px 0}
table.conf tr{cursor:pointer}
td.f-ok{box-shadow:inset 0 -3px 0 var(--ok)}
td.f-derivado{background:var(--calcbg)!important;color:var(--calc)}
td.f-lido{box-shadow:inset 0 -3px 0 var(--ink3)}
td.f-conferir{background:var(--warnbg)!important;color:var(--warn);font-weight:700}
td.f-faltando{background:var(--badbg)!important;color:var(--bad);font-weight:700}
td.f-user{background:var(--userbg)!important;color:var(--user)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink2);margin:6px 0 2px}
.legend2 span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px}
.banner.warn{background:var(--warnbg);color:var(--warn)} .banner.bad{background:var(--badbg);color:var(--bad)} .banner.ok{background:var(--okbg);color:var(--ok)} .banner.info{background:var(--calcbg);color:var(--calc)}
.thumb{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.prog>div{height:100%;width:0;background:var(--accent);transition:width .25s}
/* folha inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.field{margin:12px 0}
.field label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.field input{width:100%;font:600 20px ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input.f-conferir{border-color:var(--warn);background:var(--warnbg)} .field input.f-faltando{border-color:var(--bad);background:var(--badbg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it img{width:64px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.list .it .t{flex:1;min-width:0}
.badge{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--userbg);color:var(--user);margin-left:6px}
.empty{text-align:center;padding:26px 8px;color:var(--ink2)}
.zoom{position:fixed;inset:0;background:#000;z-index:40;overflow:auto}
.zoom img{width:220%;max-width:none;display:block}
.zoom button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:41;width:auto}
ol.tips{margin:6px 0 0;padding-left:20px;color:var(--ink2);font-size:13.5px}
ol.tips li{margin:3px 0}

.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.seg{display:inline-flex;background:var(--p50);border:1px solid var(--p200);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:9px 20px;border-radius:9px;font:700 14px system-ui;color:var(--p700);cursor:pointer;min-width:74px}
.seg button.on{background:var(--p700);color:#fff;box-shadow:0 2px 6px rgba(100,42,144,.35)}
.seg button:disabled{opacity:.35}
@media (prefers-color-scheme: dark){.seg{background:#2a1c3d;border-color:#4a3466}.seg button{color:#d3b5f0}.seg button.on{background:#8549b5}}
.kpi.wide{grid-column:span 2}
.kpi .v{color:var(--ink)}
.aberto,.fechado{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.aberto{background:var(--p700);color:#fff} .fechado{background:var(--line);color:var(--ink2)}
b.dias{color:var(--p700)}
@media (prefers-color-scheme: dark){b.dias{color:#d3b5f0}}
td.dias-aberto{color:var(--p700);font-weight:700}
td.dim{color:var(--ink3)}
.legend i.ln{width:14px;height:0;border-top:2.5px solid var(--ink2);border-radius:0;vertical-align:3px;background:none}
.legend i.ln.dash{border-top:2px dashed var(--ink2)}
.card h2{color:var(--p700)}
@media (prefers-color-scheme: dark){.card h2{color:#c9a6ec}}

.seg button{padding:9px 14px;min-width:0;flex:1}
.seg{display:flex;width:100%}
.topbar{flex-direction:column;align-items:stretch}
.topbar .meta-line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.list-msg{margin:6px 0 0;padding-left:0;list-style:none;font-size:13px}
.list-msg li{padding:6px 8px;border-radius:8px;margin:4px 0}
.list-msg.err li{background:var(--badbg);color:var(--bad)}
.list-msg.warn li{background:var(--warnbg);color:var(--warn)}
.list-msg.info li{background:var(--okbg);color:var(--ok)}
.list-msg b{font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;font:12.5px ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);white-space:pre;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--p50);color:var(--p700);border:1px solid var(--p200);font-weight:600}
@media (prefers-color-scheme: dark){.chip{background:#2a1c3d;color:#d3b5f0;border-color:#4a3466}}
.origem{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:700}
.origem.publicado{background:var(--calcbg);color:var(--calc)} .origem.importado{background:var(--userbg);color:var(--user)}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0;padding:10px;border-radius:10px;background:var(--warnbg);color:var(--warn)}
label.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--p700)}
h3.sub{font-size:13px;margin:14px 0 4px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--p50);padding:1px 5px;border-radius:5px}
@media (prefers-color-scheme: dark){code{background:#2a1c3d}}
@media (max-width:375px){table.conf{font-size:12px;letter-spacing:-.3px}table.conf td{padding:8px 3px}table.conf th{padding:0 3px;font-size:10px}table.conf .pill{padding:2px 5px}}
/* seleção — toque bem clarinho do laranja #FF9901 */
:root{--selbg:#FFF4E3;--selln:#FFD9A0;--selink:#B86A00}
@media (prefers-color-scheme: dark){:root{--selbg:rgba(255,153,1,.13);--selln:rgba(255,153,1,.45);--selink:#FFB547}}
table.tsel tbody tr{cursor:pointer}
table.tsel tbody tr.sel td{background:var(--selbg);border-top-color:var(--selln);border-bottom-color:var(--selln)}
table.tsel tbody tr.sel td:first-child{border-left-color:var(--selln);box-shadow:inset 3px 0 0 #FF9901;color:var(--selink)}
table.tsel tbody tr.sel td:last-child{border-right-color:var(--selln)}
.kpi.ksel{border-color:var(--selln);background:linear-gradient(0deg,var(--selbg),var(--selbg)),var(--card)}
.selflag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--selbg);color:var(--selink);border:1px solid var(--selln);margin-left:4px;vertical-align:1px}
.selchip{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--selln);background:var(--selbg);color:var(--selink);border-radius:10px;padding:8px 12px;font:600 13px system-ui;cursor:pointer}
.selchip>span:last-child{font-size:15px;line-height:1;font-weight:700}.selchip .t{text-align:left}
.cap.capsel{color:var(--selink);font-weight:600}
.chart svg .hit{cursor:pointer}
/* status com tons mais calmos (cores da empresa clareadas) */
:root{--verdeS:#BCDD83;--amareloS:#FFC266;--vermelhoS:#F286AF}
@media (prefers-color-scheme: dark){:root{--verdeS:#8DAE57;--amareloS:#D9A04A;--vermelhoS:#C9668C}}
/* tons das camadas do gráfico de volume */
:root{--bar1:var(--p100);--bar2:var(--p300);--bar3:var(--p700)}
@media (prefers-color-scheme: dark){:root{--bar1:#4a3466;--bar2:#8549b5;--bar3:#d5bfe7}}
.legend i{border-radius:3px}
/* variações: verde melhorou, vermelho piorou */
.dlt{font-variant-numeric:tabular-nums;white-space:nowrap}
.dlt.up{color:#5F8A12} .dlt.down{color:#D0256A} .dlt.neu{color:var(--ink2)} .dlt.vol{color:var(--ink2);font-weight:600}
@media (prefers-color-scheme: dark){.dlt.up{color:#B6E05A}.dlt.down{color:#FF6FA5}}
/* arrastar para trocar Dia/Semana/Mês */
html,body{overflow-x:hidden}
/* inclui os contêineres das tabelas (com rolagem horizontal o navegador "roubava" o gesto) */
#main.modo-painel,#main.modo-painel *{touch-action:pan-y pinch-zoom}
#pag{will-change:transform}
/* compartilhar */
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:6px 12px;font:650 13px system-ui;cursor:pointer}
.hbtn svg{width:16px;height:16px}
.hbtn[hidden]{display:none}
.shprev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);margin-bottom:10px}
.shprev img{width:100%;display:block}
.shmsg{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 12px;color:var(--ink2)}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){header .ver{display:none}}
@media (max-width:340px){header h1{font-size:16px;letter-spacing:0}}
/* aba Teams */
.shtabs{margin-bottom:10px}
.shteams{background:#fff;color:#1F1530;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:0 0 12px;max-height:46vh;overflow:auto}
.shteams p{margin:8px 0}
.shteams table{font-variant-numeric:tabular-nums}
/* gráfico do meio: barras de chamadas recebidas + linha de NS */
:root{--barR:#C9AEE3}
@media (prefers-color-scheme: dark){:root{--barR:#6b4a8f}}
.legend i.ln.mk{position:relative;width:18px}
.legend i.ln.mk::after{content:"";position:absolute;left:5px;top:-5px;width:6px;height:6px;border:2px solid var(--laranjaL);border-radius:50%;background:var(--card)}
.kdist .v .dlt{font-size:inherit}
/* segmento (topo) e compartilhar (botão flutuante, só ícone, canto inferior direito, acima do menu) */
.segbtn{font-size:14px;padding:6px 10px 6px 14px;letter-spacing:.3px}
.segbtn svg{width:16px;height:16px;transition:transform .15s}
.segbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.segmenu{position:fixed;right:12px;z-index:30;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(31,21,48,.22);padding:6px}
.segmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;color:var(--ink);font:650 15px system-ui;padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left}
.segmenu button small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3);margin-top:1px}
.segmenu button.on{background:rgba(133,73,181,.13);color:var(--p700)}
.segmenu button .ck{font-size:15px;visibility:hidden}
.segmenu button.on .ck{visibility:visible}
@media (prefers-color-scheme: dark){.segmenu button.on{color:#d3b5f0}}
.fab{position:fixed;right:16px;bottom:calc(76px + var(--safe-b));z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--p700);color:#fff;box-shadow:0 6px 18px rgba(58,22,88,.38);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fab svg{width:23px;height:23px}
.fab[hidden]{display:none}
.fab:active{transform:scale(.94)}
@media (prefers-color-scheme: dark){.fab{background:#8549b5;box-shadow:0 6px 18px rgba(0,0,0,.5)}}
#main.modo-painel{padding-bottom:calc(150px + var(--safe-b))}
/* cards: nada quebra linha no meio de um selo ou de uma variação */
.kpi .l,.kpi .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s .dlt{font-weight:700} .pill{white-space:nowrap}
.kpi.kper .v{font-size:17px;white-space:nowrap;margin-top:5px;margin-bottom:3px}
.parc{color:var(--p700);font-weight:700}
/* filtro do modo Dia: cápsulas dos dias da semana (o ✕ só aparece com filtro ligado) */
.wdf{display:flex;gap:5px;align-items:center;margin:12px 0}
.wdf button{flex:1 1 0;min-width:0;height:32px;padding:0;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wdf button.dom{color:var(--vermelho)}
.wdf button.on{background:var(--p700);border-color:var(--p700);color:#fff}
.wdf button:disabled{opacity:.4;cursor:default}
.wdf .wdx{flex:0 0 32px;width:32px;background:var(--selbg);border-color:var(--selln);color:var(--selink);font-size:13px}
@media (prefers-color-scheme: dark){.wdf button.on{background:#8549b5;border-color:#8549b5}}
@media (prefers-color-scheme: dark){.parc{color:#d3b5f0}}
/* linha do NS em laranja (#FF9901) */
:root{--laranjaL:#FF9901;--nsLab:#7F3C00}
@media (prefers-color-scheme: dark){:root{--laranjaL:#FFB038;--nsLab:#FFD08A}}
/* colunas de variação */
table.conf td.tv{font-size:.92em;white-space:nowrap}
table.conf td.tv .dlt{font-weight:700}
table.conf td.nd{color:var(--ink3)}
/* ---- problemas sistêmicos (matriz sistemas × períodos) ---- */
:root{--grid:#f6f3f9;--gridOn:#ebe1f4;--fTotal:#EC357D;--fParcial:#FF9901;--fInterm:#0164C9;--fLent:#99CC33;--fOutro:#9a90a8;--tot:#642A90;
  --sdA:#efebf3;--sdB:#e2dbe9}
@media (prefers-color-scheme: dark){:root{--grid:#251b33;--gridOn:#352650;--fInterm:#3d8fe6;--tot:#a77bd4;--sdA:#1a1226;--sdB:#2b2039}}
.mxcard .mxhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;margin:0 0 4px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.mxcard .mxhead h2{flex:1;margin:0}
.mxcard .mxhead .seta{flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--p700)}
.mxcard .mxhead .seta svg{width:22px;height:22px}
@media (prefers-color-scheme: dark){.mxcard .mxhead .seta{color:#d3b5f0}}
.mxcard .mxsub{font-size:12px;color:var(--ink3);margin-bottom:10px}
.mxcard .mxerr{margin:8px 0}.mxcard .mxerr ul{margin:6px 0 0;padding-left:18px}
.mx{display:grid;grid-template-columns:var(--lab) repeat(var(--n),minmax(0,1fr)) 40px;column-gap:3px;row-gap:4px;align-items:stretch;margin-top:6px}
.mx .hd{font-size:11px;font-weight:700;color:var(--ink2);text-align:center;padding:2px 0 4px;line-height:1.15;cursor:pointer;border-radius:6px;border:0;background:none;font-family:inherit;min-width:0}
.mx .hd small{display:block;font-size:9px;font-weight:500;color:var(--ink3)}
.mx .hd.dom,.mx .hd.dom small{color:var(--vermelho)}
.mx .hd.and{color:var(--p700)}
.mx .hd.sd{color:var(--ink3)}
.mx .hd.sel,.mx .hd.sel small{background:var(--selbg);color:var(--selink)}
.mx .corner{font-size:10px;color:var(--ink3);align-self:end;padding-bottom:4px}
.mx .tot{font-size:10.5px;font-weight:700;color:var(--ink2);text-align:right;align-self:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx .tot.hd2{font-size:9.5px;color:var(--ink3);align-self:end;padding-bottom:4px;font-weight:600}
.mx .tot.tt{color:var(--p700)}
.mx .sys{font-size:11px;line-height:1.15;font-weight:600;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;align-self:center;padding-right:2px}
.mx .sys.sel{color:var(--selink)}
.mx .sys.totl{font-weight:800;color:var(--p700)}
@media (prefers-color-scheme: dark){.mx .sys.totl,.mx .tot.tt{color:#d3b5f0}.mx .hd.and{color:#d3b5f0}}
.mx .sep{grid-column:1 / -1;height:1px;background:var(--line);margin:2px 0}
.mx .cel{position:relative;height:28px;border-radius:6px;background:var(--grid);overflow:hidden;cursor:default;border:0;padding:0;display:block;width:100%;min-width:0}
.mx .cel.tem{cursor:pointer;background:var(--gridOn)}
/* sem dados de sistemas (período fora do arquivo): listrado, diferente de "sem problema" */
.mx .cel.sd{background:repeating-linear-gradient(135deg,var(--sdA) 0 4px,var(--sdB) 4px 8px)}
.mx .cel.colsel{background:var(--selbg)}
.mx .cel.sd.colsel{background:repeating-linear-gradient(135deg,var(--selbg) 0 4px,var(--selln) 4px 8px)}
.mx .cel.sel{outline:2px solid #FF9901;outline-offset:-1px;background:var(--selbg)}
.mx .cel .dv{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mx .cel .bar{position:absolute;top:6px;height:16px;border-radius:3px;min-width:3px}
.mx .cel .bar.tot{background:var(--tot)}
.mx .cel .bar.indev{background:repeating-linear-gradient(45deg,var(--ink3) 0 2px,transparent 2px 5px)!important;opacity:.8}
.mx .cel .fora{position:absolute;top:4px;bottom:4px;width:4px;border:1.5px dashed var(--ink2);border-radius:2px}
.mxcard .legend{gap:6px 12px;margin-top:10px}
.mxcard .legend span{display:inline-flex;align-items:center;gap:5px}
.mxcard .legend i{width:12px;height:10px;border-radius:2px;margin-right:0}
.mxcard .legend i.fora{width:5px;height:12px;border:1.5px dashed var(--ink2);border-radius:2px}
.mxcard .legend i.indev{background:repeating-linear-gradient(45deg,var(--ink3) 0 2px,transparent 2px 5px)}
.mxcard .legend i.sd{background:repeating-linear-gradient(135deg,var(--sdA) 0 2px,var(--sdB) 2px 4px);outline:1px solid var(--line)}
.mxcard .cap{font-size:12.5px;color:var(--ink2);margin-top:8px}
.mxcard .vazio{font-size:13.5px;color:var(--ink2);padding:14px 4px;text-align:center}
@media (max-width:380px){.mx{column-gap:2px}.mx .sys{font-size:10.5px}.mx .cel{height:26px}.mx .cel .bar{top:5px}}
/* folhas dos sistemas: flutuante, com margem, cabeçalho fixo e rolagem só no corpo */
.sheet-bg.shs{padding:12px 12px calc(12px + var(--safe-b))}
.sheet.shs{max-width:640px;border-radius:20px;border:1px solid var(--line);padding:14px 8px 8px 16px;max-height:min(80vh,calc(100vh - 80px));display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(20,8,40,.35)}
.shs .sh-cab{flex:0 0 auto;padding:0 8px 8px 0;border-bottom:1px solid var(--line)}
.shs .sh-corpo{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 8px 6px 0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(100,42,144,.32) transparent}
.shs .sh-corpo::-webkit-scrollbar{width:5px}
.shs .sh-corpo::-webkit-scrollbar-track{background:transparent;margin:6px 0}
.shs .sh-corpo::-webkit-scrollbar-thumb{background:rgba(100,42,144,.32);border-radius:99px}
@media (prefers-color-scheme: dark){.shs .sh-corpo{scrollbar-color:rgba(211,181,240,.35) transparent}.shs .sh-corpo::-webkit-scrollbar-thumb{background:rgba(211,181,240,.35)}}
.shs .sh-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
.shs .sh-acoes{display:flex;gap:6px;flex:0 0 auto}
.shs .sh-top h3{margin:0;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere;padding-top:5px}
.shs .sh-x,.shs .sh-volta{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:99px;height:32px;font:650 13px system-ui;cursor:pointer;padding:0 11px;white-space:nowrap}
.shs .sh-sub{font-size:12.5px;color:var(--ink3)}
.shs .sh-per{color:var(--selink);font-weight:500}
.shs .pill{padding:1px 8px;font-size:11px;font-weight:700;color:#fff;margin-right:4px}
.shs .pill.lt{background:var(--line);color:var(--ink2)}
.shs .li{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;cursor:pointer;color:var(--ink);font:inherit}
.shs .li:first-of-type{border-top:0}
.shs .li:active{background:var(--p50)}
.shs .li .bx{flex:1;min-width:0}
.shs .li .l1{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.shs .li .l1 .id{font-size:12px;color:var(--ink3);font-weight:600;white-space:nowrap}
.shs .li .l2{font-size:12.5px;color:var(--ink2);margin-top:2px;display:block}
.shs .li .l3{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:1px;font-size:12.5px;color:var(--ink2);margin-top:4px}
.shs .li .l3 b{font-weight:600;color:var(--ink3)}
.shs .li .seta{color:var(--ink3);font-size:18px;align-self:center}
.shs dl.det{display:grid;grid-template-columns:minmax(110px,38%) 1fr;margin:6px 0 0;font-size:13.5px}
.shs dl.det dt{color:var(--ink3);padding:7px 8px 7px 0;border-top:1px solid var(--line)}
.shs dl.det dd{margin:0;padding:7px 0;border-top:1px solid var(--line);overflow-wrap:anywhere;color:var(--ink)}
.shs dl.det dt:first-of-type,.shs dl.det dd:first-of-type{border-top:0}
.shs dl.det dd .pill{white-space:normal}
.shs dl.det .grp{grid-column:1 / -1;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--p700);padding:12px 0 2px}
@media (prefers-color-scheme: dark){.shs dl.det .grp{color:#d3b5f0}}
</style>
</head>
